---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Shared modules for every blue-hour flavour.
#
# Flavour recipes pull this in first (`- from-file: common.yml`) and must end
# with `- type: signing`. Because everything shared lives here, the gaming
# flavour (common.yml + gaming modules) is a strict superset of workstation.
#
# Port status: scaffold. See docs/port-plan.md for the phase-by-phase work.
modules:
  # --- System files -------------------------------------------------------
  # files/system/* is copied into the image root (/). Put system config under
  # files/system/etc/... ; it is moved to /usr/etc on deployment.
  - type: files
    files:
      - source: system
        destination: /

  # --- Base CLI/system packages ------------------------------------------
  # Ported from nixos-config modules/core/system.nix, minus what the base image
  # already ships (vim, curl, wget, wl-clipboard, libnotify, ...).
  # TODO(port, phase 2): zram, fwupd, CUPS (printing), sysctl/udev.
  # (timezone/locale/keymap are set at install time; not baked in.)
  #
  # zsh is the login shell for every human user. The image owns the binary and
  # (via the unit below + /etc/shells) the login-shell assignment; Home Manager
  # still owns ~/.zshrc and the plugins. See docs/port-plan.md phase 2.
  #
  # The rest is a small "batteries" baseline so a fresh account is usable
  # before Home Manager runs. This is deliberately additive: the dotfiles repo
  # keeps its own copies of these tools (its bundles are meant to travel to
  # other machines). Shell-integration tools (zoxide/starship/carapace/fzf
  # keybinds), dev toolchains/LSPs and neovim stay in Home Manager.
  - type: dnf
    install:
      packages:
        - git
        - ppp
        - playerctl
        - cava
        # shell + login-shell plumbing (shadow-utils provides usermod)
        - zsh
        - shadow-utils
        # file/text/search
        - bat
        - fd-find # binary: fd
        - ripgrep
        - eza
        - tree
        - file
        - jq
        - yq
        - less
        # disk usage
        - du-dust # Fedora binary name; Home Manager's is `dust`
        - ncdu
        # archives
        - unzip
        - zip
        - p7zip
        - p7zip-plugins
        # media / documents / images
        - mediainfo
        - poppler-utils
        - ImageMagick
        # terminal niceties
        - chafa
        - btop
        - tealdeer
        - trash-cli
        - rsync
        # general dev-ish utilities
        - gh
        - shellcheck
        - shfmt

  # --- Fonts -------------------------------------------------------------
  # Session/GTK/Flatpak-wide fonts (NixOS modules/desktop/apps.nix + the HM
  # baseExtra bundle). Home Manager still installs its own copies so the
  # dotfiles repo remains portable. Emoji/general fallbacks come from the base
  # image's google-noto-* set; the patched Nerd Fonts and Adwaita Sans/Mono
  # (needed by the GSR overlay flatpak, which reads Adwaita Sans from
  # /run/host/fonts) are added here.
  - type: fonts
    fonts:
      # Names are nerd-fonts release asset basenames (see the ryanoasis/
      # nerd-fonts "latest" release); they do not always match the nixpkgs
      # attribute names.
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - SourceCodePro # nixpkgs: nerd-fonts.sauce-code-pro
        - NerdFontsSymbolsOnly # nixpkgs: nerd-fonts.symbols-only
        - Ubuntu
        - Iosevka
      url-fonts:
        - name: Adwaita
          url: https://download.gnome.org/sources/adwaita-fonts/50/adwaita-fonts-50.0.tar.xz

  # --- System baseline Flatpaks ------------------------------------------
  # Ported from nixos-config modules/flatpak/system.nix. The base image already
  # sets up the Flathub remote; this only installs the baseline set.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.mpv.Mpv
          - io.github.kolunmi.Bazaar
          - be.alexandervanhee.gradia
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Weather
          - org.gnome.Maps
          - org.gnome.Papers
          - org.gnome.Loupe
          - org.gnome.Snapshot
          - org.gnome.SoundRecorder
          - org.gnome.TextEditor
          - org.gnome.FileRoller
          - org.gnome.baobab
          - org.gnome.font-viewer
          - org.gnome.Decibels
          - org.gnome.Logs
          - org.gnome.SimpleScan
          - org.gnome.Connections
          - org.gnome.Firmware
          - org.gnome.Boxes
          - org.gnome.DejaDup
          - org.gnome.seahorse.Application
          - org.mozilla.thunderbird_esr
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - it.mijorus.gearlever
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
      - scope: user

  # --- Tuned system daemons (both flavours) ------------------------------
  # ananicy-cpp: eBPF auto-nice daemon. Replaces the NixOS config's
  #   system76-scheduler (modules/core/perf.nix) — keeps interactive work
  #   responsive while builds/containers run in the background. Official
  #   CachyOS port; disable `ananicy-cpp.service` if a rule misbehaves.
  # GPU Screen Recorder: the primary screenshot + screen-recording tool
  #   (NixOS modules/desktop/gsr.nix). Its gsr-shot/gsr-rec helpers land in
  #   phase 3 (files/scripts); gsr-kms-server capabilities come from the RPM.
  #   GSR needs VA-API (NOT VDPAU), which the base already provides:
  #     AMD   -> fedora-multimedia mesa (mesa-va-drivers/mesa-dri-drivers)
  #     Intel -> libva-intel-media-driver (iHD, Broadwell+) + intel-vaapi-driver (i965)
  #     plus libva-utils (vainfo) for debugging. No extra driver packages needed.
  #   Verify per-GPU with `vainfo` in the VM (phase 3). The VDPAU packages from
  #   graphics.nix (libva-vdpau-driver, libvdpau-va-gl) are interop for other
  #   apps and are intentionally not added — GSR does not use them, and
  #   mesa-vdpau-drivers can clash with the base's replaced mesa.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos-addons
        - brycensranch/gpu-screen-recorder-git
    install:
      packages:
        - ananicy-cpp
        - cachyos-ananicy-rules
        - gpu-screen-recorder

  - type: systemd
    system:
      enabled:
        - ananicy-cpp.service
        # Installer-created users start on bash; this idempotent oneshot sets
        # /usr/bin/zsh as their login shell before the display manager. See
        # files/system/usr/libexec/blue-hour-set-login-shell.
        - blue-hour-set-login-shell.service

  # --- TODO(port) --------------------------------------------------------
  # phase 3  Desktop stack: Sway (built from source via `stages`), Ly +
  #          ly-selinux, Noctalia, pipewire, portals, keyring, fonts,
  #          adw-gtk3 + Hatter, nwg-look, gsr-shot/gsr-rec helpers.
  # phase 1  Nix: dnf install nix nix-daemon, /var/nix -> /nix bind mount,
  #          nix-daemon ordering, SELinux.
  # phase 5  TuneD + tuned-ppd with a shared power-profile mapping.
  # phase 6  Homebrew (`brew` module), topgrade, Zen Browser (system).
  # phase 7  os-release branding, justfiles for `ujust`-style update commands.
