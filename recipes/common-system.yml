---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# base system packages and tunables. Everything here is shared by
# both flavours; the config files live under files/system (copied to / by the
# files module in common.yml).
modules:
  - type: dnf
    install:
      packages:
        - btrfsmaintenance
  - type: systemd
    system:
      enabled:
        - btrfs-scrub.timer
