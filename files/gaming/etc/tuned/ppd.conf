# Gaming-flavour PPD -> TuneD profile mapping.
#
# This replaces the shared /etc/tuned/ppd.conf for the gaming flavour: the only
# difference is that PPD `performance` maps to TuneD's `latency-performance`
# profile instead of `throughput-performance`. tuned-ppd reads a single file
# (there is no ppd.conf.d drop-in), so the gaming recipe re-applies the whole
# file after the tuned-ppd RPM is installed.
#
# The mapping must stay bijective so tuned-ppd can report the active profile
# back to clients (Noctalia's power widget, the game-performance helper).
# See docs/port-plan.md phase 5.
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=latency-performance

[battery]
# On battery, balanced maps to TuneD's balanced-battery profile (Fedora default).
balanced=balanced-battery
