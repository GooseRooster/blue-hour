# Kernel console font used by the Ly TUI and its bigclock.
#
# Ly renders with the console font and its bigclock needs a PSF font (a TTF
# like JetBrains Mono Nerd is unusable in a TTY). ter-u28n is the 14x28
# Terminus face shipped by terminus-fonts-console.
#
# Note: the installer writes /etc/vconsole.conf at install time; if that
# shadows this value, set the font via the ly-kmsconvt@tty2 unit instead.
FONT=ter-u28n
