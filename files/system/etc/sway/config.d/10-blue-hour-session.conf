# blue-hour Sway session plumbing (included from /etc/sway/config).
#
# Sway is not a systemd session manager, so nothing exports the compositor
# environment to the systemd user manager or the D-Bus activation environment.
# xdg-desktop-portal, the gcr SSH agent, and other user services need
# WAYLAND_DISPLAY/SWAYSOCK/XDG_CURRENT_DESKTOP, so import them here.
#
# (If the session is ever moved under UWSM, this file becomes redundant.)

exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

# Sway has no session manager to pull in the XDG autostart units generated by
# systemd-xdg-autostart-generator (e.g. Flatpak's Background portal entries).
# Start the standard target that collects them; harmless if nothing wants it.
exec systemctl --user start xdg-desktop-autostart.target
