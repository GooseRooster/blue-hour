# Ly display manager configuration.
# Ported from nixos-config modules/desktop/noctalia.nix (services.displayManager.ly.settings).
# ly reads /etc/ly/config.ini; keep in sync with docs/port-plan.md phase 3.

# Monochrome: black background, white text, no borders.
# Colours are 0xSSRRGGBB where SS carries termbox styling bits.
bg = 0x02000000
fg = 0x01FFFFFF
error_fg = 0x01FFFFFF
hide_borders = true

# Clock module (ly also has the user/session selector built in).
clock = %a %d %b  %H:%M
bigclock = en
