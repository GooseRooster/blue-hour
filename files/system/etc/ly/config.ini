# Ly display manager configuration.
# Ported from nixos-config modules/desktop/noctalia.nix (services.displayManager.ly.settings).
# ly reads /etc/ly/config.ini; keep in sync with docs/port-plan.md phase 3.

# Monochrome: black background, white text, no borders.
# Colours are 0xSSRRGGBB where SS carries termbox styling bits.
bg = 0x02000000
fg = 0x01FFFFFF
error_fg = 0x01FFFFFF
hide_borders = true

# Clock module (ly also has the user/session selector built in).
clock = %a %d %b  %H:%M
bigclock = en

# Ly runs `setup_cmd <login_cmd> <session>` for every session, so this must be
# reachable or all sessions die with EACCES. Fedora installs /etc/ly/setup.sh
# 0644 and shebang-stripped and papers over it by shipping
# `setup_cmd = /bin/sh /etc/ly/setup.sh`. This file replaces the RPM's
# config.ini, so it must repeat the distro's /bin/sh prefix; without it Ly falls
# back to the compiled default (`/etc/ly/setup.sh`) and execs a non-executable
# file. Keep in sync with the ly.spec %install on every base bump.
setup_cmd = /bin/sh /etc/ly/setup.sh

# The session log defaults to the relative path "ly-session.log", which Ly
# creates in the user's home *as the display-manager process* (it chdirs there
# before exec'ing the session but before switching to the user context). SELinux
# denies that write, and because executeCmd() treats it as fatal the session
# aborts with AccessDenied before the compositor is ever launched (upstream
# #822; the maintainer's recommended workaround is to disable it). Ly's own
# /var/log/ly.log still works for debugging.
session_log = null

# "save = true" makes Ly write its last user/session to /etc/ly/save.txt, which
# the display-manager SELinux domain is also denied; it only logs an error, so
# disable it to avoid the noise and the /etc drift.
save = false
