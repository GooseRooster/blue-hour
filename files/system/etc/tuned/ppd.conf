# Shared PPD -> TuneD profile mapping for both blue-hour flavours.
#
# tuned-ppd translates the power-profiles-daemon API (used by Noctalia's
# power-profile widget and the game-performance helper) onto TuneD. This file
# ships the mapping from the author's NixOS power config:
#   power-saver -> powersave, balanced -> balanced,
#   performance -> throughput-performance.
#
# The gaming flavour overrides performance -> latency-performance in
# /etc/tuned/ppd.conf.d/10-gaming.conf (dropped in by recipes/gaming.yml).
# The mapping must stay bijective so tuned-ppd can report the active profile
# back to clients (see docs/port-plan.md phase 5).
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# On battery, balanced maps to TuneD's balanced-battery profile (Fedora default).
balanced=balanced-battery
