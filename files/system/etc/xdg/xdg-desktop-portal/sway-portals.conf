# XDG desktop portal backend selection for the Sway session.
#
# Overrides the sway package's /usr/share/xdg-desktop-portal/sway-portals.conf.
# Screenshare/screenshot go to the wlr backend; Secret goes to gnome-keyring
# (its .portal is UseIn=gnome, so it needs an explicit mapping for flatpak
# apps that store credentials); Background/GlobalShortcuts come from the gnome
# backend, which fills the gaps the gtk backend leaves.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Background=gnome
org.freedesktop.impl.portal.GlobalShortcuts=gnome
