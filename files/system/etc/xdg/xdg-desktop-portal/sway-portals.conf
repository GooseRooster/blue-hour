# XDG desktop portal backend selection for the Sway session.
#
# Overrides the sway package's /usr/share/xdg-desktop-portal/sway-portals.conf.
# Screenshare/screenshot go to the wlr backend; Secret goes to gnome-keyring
# (its .portal is UseIn=gnome, so it needs an explicit mapping for flatpak apps
# that store credentials). Everything else falls to the gtk backend.
#
# We deliberately do NOT use xdg-desktop-portal-gnome: it pulls gnome-desktop4/
# gtk4/libadwaita/graphene and most of its backends call org.gnome.Shell.* D-Bus
# interfaces that don't exist under Sway, so it can't function here anyway.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
