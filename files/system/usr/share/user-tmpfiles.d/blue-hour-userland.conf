# Seed the default topgrade configuration on login.
#
# Processed by `systemd-tmpfiles --user` when the user's systemd instance
# starts. `L` only creates the symlink when nothing exists yet, so a user's own
# file is never clobbered. topgrade merges ~/.config/topgrade.d/* BEFORE
# ~/.config/topgrade.toml, so the user's main config always overrides this
# default. See files/system/usr/share/blue-hour/topgrade/00-blue-hour.toml.
d %h/.config/topgrade.d 0755 - - -
L %h/.config/topgrade.d/00-blue-hour.toml - - - - /usr/share/blue-hour/topgrade/00-blue-hour.toml
