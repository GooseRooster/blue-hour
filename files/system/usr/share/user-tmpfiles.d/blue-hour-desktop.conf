# Seed per-user desktop defaults on login.
#
# Processed by `systemd-tmpfiles --user` when the user's systemd instance
# starts. `L` only creates the symlink when nothing exists yet, so a user's own
# (e.g. Home-Manager-owned) file is never clobbered. The sway symlink points at
# the system default so Noctalia's sway template cannot shadow /etc/sway/config.
d %h/.config/sway 0755 - - -
L %h/.config/sway/config - - - - /etc/sway/config

d %h/.config/noctalia 0755 - - -
L %h/.config/noctalia/00-blue-hour-defaults.toml - - - - /etc/noctalia/00-blue-hour-defaults.toml
