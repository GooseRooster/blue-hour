# Recreate the Nix store layout inside the persistent /var/nix. The Fedora
# nix RPM creates these under the image /nix, but that content is hidden once
# nix.mount bind-mounts /var/nix (empty on a fresh install) over it.
d /nix/store 1775 root nixbld - -
d /nix/var 0755 root root - -
d /nix/var/log 0755 root root - -
d /nix/var/log/nix 0755 root root - -
d /nix/var/log/nix/drvs 1775 root nixbld - -
d /nix/var/nix 0775 root nixbld - -
d /nix/var/nix/daemon-socket 0775 root nixbld - -
# Relabel the daemon socket dir *and its contents* (SELinux file context
# var_run_t, registered by files/scripts/nix-selinux.sh) so systemd/init_t may
# create the listening socket there. `Z` (not `z`) matters: a stale
# daemon-socket/socket left from a previous boot is itself default_t until
# relabeled, and nix-daemon.socket unlinks it before re-binding — with only the
# dir relabeled that unlink is still denied and the socket unit fails. /nix is a
# fresh bind of /var/nix each boot, so this must run every boot.
Z /nix/var/nix/daemon-socket 0775 root nixbld - -
d /nix/var/nix/db 0775 root nixbld - -
d /nix/var/nix/gcroots 0775 root nixbld - -
d /nix/var/nix/gcroots/per-user 1777 root root - -
d /nix/var/nix/profiles 0775 root nixbld - -
d /nix/var/nix/profiles/per-user 1777 root root - -
d /nix/var/nix/temproots 0775 root nixbld - -
f /nix/var/nix/gc.lock 0664 root nixbld - -
